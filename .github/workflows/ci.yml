name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/bersama_test
      PAYLOAD_SECRET: test-secret-do-not-use-in-prod
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run test

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint-typecheck]
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/bersama_test
      PAYLOAD_SECRET: test-secret
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      NEXT_PUBLIC_GA4_ID: G-TEST
      NEXT_PUBLIC_CLARITY_ID: test
      NEXT_PUBLIC_ONESIGNAL_APP_ID: test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Build
        working-directory: apps/web
        run: bun run build
